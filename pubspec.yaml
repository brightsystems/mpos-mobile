name: mpos_mobile
description: Mobile POS terminal for shift QR login, menu sync, and checkout.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.5
  get_it: ^8.0.3
  go_router: ^17.1.0
  http: ^1.2.1
  shared_preferences: ^2.3.5
  mobile_scanner: ^7.0.1
  sliding_up_panel: ^2.0.0+1
  app_image: ^1.0.13
  url_launcher: ^6.3.0
  intl: ^0.20.2
  google_fonts: ^8.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
