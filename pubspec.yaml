name: mpos_mobile
description: Mobile POS terminal for shift QR login, menu sync, and checkout.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.5
  get_it: ^8.0.3
  go_router: ^17.1.0
  http: ^1.2.1
  http_parser: ^4.0.2
  shared_preferences: ^2.3.5
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  sliding_up_panel: ^2.0.0+1
  app_image: ^1.0.13
  url_launcher: ^6.3.0
  intl: ^0.20.2
  google_fonts: ^8.0.2
  printing: ^5.13.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

# App launcher icon. Source PNG must be at assets/images/app_icon.png (1024x1024).
# Generate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FF8935"
  adaptive_icon_foreground: "assets/images/app_icon.png"

# Native OS splash (shown before Flutter starts). Matches the in-app splash.
# Generate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FF8935"
  image: "assets/images/app_icon.png"
  android_12:
    color: "#FF8935"
    image: "assets/images/app_icon.png"
  color_dark: "#E0670D"
  image_dark: "assets/images/app_icon.png"
